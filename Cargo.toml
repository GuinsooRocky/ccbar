[package]
name = "ccbar"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6.0.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
